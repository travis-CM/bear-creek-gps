name: BearCreekGPS
options:
  bundleIdPrefix: com.travisgafford
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z37HGURHX8
    CODE_SIGN_STYLE: Automatic
targets:
  BearCreekGPS:
    type: application
    platform: iOS
    scheme: {}
    sources: [iOS]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: GolfHub
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSLocationWhenInUseUsageDescription: GolfHub uses your location for live yardages on the course.
        NSLocationAlwaysAndWhenInUseUsageDescription: GolfHub keeps yardages and shot tracking running while your phone is in your pocket.
        NSCameraUsageDescription: Take a photo of the pin sheet.
        NSPhotoLibraryUsageDescription: Choose a photo of the pin sheet.
        NSMicrophoneUsageDescription: Dictate who hit each shot.
        NSSpeechRecognitionUsageDescription: Dictate who hit each shot.
        ITSAppUsesNonExemptEncryption: false
        WKAppBoundDomains: [travis-cm.github.io]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisgafford.bearcreekgps
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BearCreekGPSWatch
  BearCreekGPSWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: GolfHub
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.travisgafford.bearcreekgps
        NSLocationWhenInUseUsageDescription: Live yardages from your watch on the course.
        NSHealthShareUsageDescription: GolfHub runs your round as a golf workout so the app and GPS stay live.
        NSHealthUpdateUsageDescription: Saves your round as a golf workout in Fitness.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.travisgafford.bearcreekgps.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
