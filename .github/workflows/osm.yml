name: Fetch course map data
on:
  push:
    paths: ['.github/workflows/osm.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenStreetMap golf features
        run: |
          Q='[out:json][timeout:180];(way[golf](32.845,-97.075,32.875,-97.04);way[natural=water](32.845,-97.075,32.875,-97.04);way[leisure=golf_course](32.845,-97.075,32.875,-97.04););out geom tags;'
          for i in 1 2 3; do
            for U in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              echo "Trying $U"
              if curl -sS -m 200 --data-urlencode "data=$Q" "$U" -o osm.tmp && python3 -c "import json;d=json.load(open('osm.tmp'));assert len(d['elements'])>200;print(len(d['elements']))"; then
                mv osm.tmp osm.json; break 2
              fi
            done
            sleep 20
          done
          test -f osm.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add osm.json
          git commit -m "Update course map data" || echo "no change"
          git push
