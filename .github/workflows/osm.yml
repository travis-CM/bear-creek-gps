name: Build course app
on:
  push:
    branches: [main]   # feature branches never build or upload; merge to main does
    paths: ['bundle.json', '.github/workflows/osm.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install numpy pillow
      - name: Course map data (OpenStreetMap) if missing
        run: |
          if [ ! -f osm.json ]; then
            Q='[out:json][timeout:180];(way[golf](32.845,-97.075,32.875,-97.04);way[natural=water](32.845,-97.075,32.875,-97.04);way[leisure=golf_course](32.845,-97.075,32.875,-97.04););out geom tags;'
            for U in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS -m 200 --data-urlencode "data=$Q" "$U" -o osm.json && python3 -c "import json;assert len(json.load(open('osm.json'))['elements'])>200" && break
            done
          fi
      - name: Creeks and streams (OpenStreetMap waterways), best effort
        continue-on-error: true
        run: |
          Q='[out:json][timeout:120];way[waterway](32.845,-97.075,32.875,-97.04);out geom tags;'
          for i in 1 2 3; do
            for U in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS -m 150 --data-urlencode "data=$Q" "$U" -o water.new && python3 -c "import json;json.load(open('water.new'))['elements']" && mv water.new water.json && break 2
            done
            sleep 20
          done
          rm -f water.new
          python3 -c "import json;print('waterway ways:',len(json.load(open('water.json'))['elements']))" || rm -f water.json
      - name: Unpack app bundle
        run: |
          test -f bundle.json || exit 0
          python3 -c "import json,os;[(os.makedirs(os.path.dirname(k) or '.',exist_ok=True),open(k,'w').write(v)) for k,v in json.load(open('bundle.json'))['files'].items()]"
      - name: Elevation (USGS 3DEP) + logo + build
        run: |
          test -f build.py || exit 0
          for i in 1 2 3 4 5; do
            curl -sS -m 180 -o dem.tif "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage?bbox=-97.075,32.845,-97.040,32.875&bboxSR=4326&imageSR=4326&size=1100,1100&format=tiff&pixelType=F32&interpolation=RSP_BilinearInterpolation&f=image" && python3 -c "from PIL import Image;Image.open('dem.tif')" && break
            sleep 15
          done
          curl -sS -m 60 -o logo.svg "https://arcisgolf.com/hubfs/Top%20Nav-Bear%20Creek%20Logo-2.svg" || true
          python3 build.py
          rm -f dem.tif
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Build app files" || echo "no change"
          git push
